[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fkplayer"
version = "1.1.4"
description = "High-performance desktop video player, screen editor, live annotation tool and actions recorder."
readme = "README.md"
authors = [
    { name = "furrykit", email = "furrykit@users.noreply.github.com" }
]
license = { text = "MIT" }
keywords = ["video-player", "screen-editor", "annotation", "pyqt5", "opencv", "ffmpeg", "wasapi", "screen-recorder"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video :: Display",
    "Topic :: Multimedia :: Graphics :: Capture :: Screen Capture",
]
requires-python = ">=3.10"
dependencies = [
    "PyQt5>=5.15.9",
    "opencv-python>=4.8.0",
    "av>=10.0.0",
    "numpy>=1.24.0",
    "soundcard>=0.4.2",
    "soundfile>=0.12.1",
    "Pillow>=9.5.0",
    "pywin32>=306",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.0.0",
    "pytest>=7.0.0",
    "flake8>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/furrykit/FKVideoPlayer"
Repository = "https://github.com/furrykit/FKVideoPlayer.git"
Issues = "https://github.com/furrykit/FKVideoPlayer/issues"
Releases = "https://github.com/furrykit/FKVideoPlayer/releases"

[project.scripts]
fkplayer = "fkplayer.__main__:main"
